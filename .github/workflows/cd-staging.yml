name: CD Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: travela-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    # Only allow manual deployment from develop.
    if: github.ref == 'refs/heads/develop'

    steps:
      # 1. Get the source code from develop.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: develop

      # 2. Validate the required files.
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          test -f Dockerfile
          test -f docker-compose.yml
          test -f composer.json
          test -f artisan
          test -f nginx/site.conf

          if [ -f .env ]; then
            echo "ERROR: .env must not be committed to Git."
            exit 1
          fi

          echo "Required files validated."

      # 3. Create the SSH private-key file and validate its format.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY_STAGING }}
          SSH_HOST: ${{ secrets.SSH_IP_STAGING }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "ERROR: SSH_KEY_STAGING is empty."
            exit 1
          }

          test -n "$SSH_HOST" || {
            echo "ERROR: SSH_IP_STAGING is empty."
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | sed 's/\r$//' > "$HOME/.ssh/staging_key"

          chmod 600 "$HOME/.ssh/staging_key"

          echo "Validating private-key format..."

          ssh-keygen -y -f "$HOME/.ssh/staging_key" \
            > /dev/null

          echo "Private-key format is valid."

          ssh-keyscan -H "$SSH_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/dev/null

          chmod 600 "$HOME/.ssh/known_hosts"

      # 4. Check SSH authentication and the existing VPS configuration.
      - name: Check remote environment
        env:
          SSH_HOST: ${{ secrets.SSH_IP_STAGING }}
          SSH_USER: ${{ secrets.SSH_USER_STAGING }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SSH_USER" || {
            echo "ERROR: SSH_USER_STAGING is empty."
            exit 1
          }

          ssh \
            -i "$HOME/.ssh/staging_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'set -eu
             test -d /home/ubuntu/devops/travela-master
             test -f /home/ubuntu/devops/travela-master/.env
             test -f /home/ubuntu/devops/travela-master/docker-compose.yml
             command -v docker
             docker compose version
             echo "Remote environment validated."'

      # 5. Upload application source without overwriting server config.
      - name: Upload source to Staging
        env:
          SSH_HOST: ${{ secrets.SSH_IP_STAGING }}
          SSH_USER: ${{ secrets.SSH_USER_STAGING }}
        shell: bash
        run: |
          set -euo pipefail

          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./docker-compose.yml' \
            --exclude='./vendor' \
            --exclude='./node_modules' \
            --exclude='./.github' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            -czf - . |
          ssh \
            -i "$HOME/.ssh/staging_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'tar -xzf - -C /home/ubuntu/devops/travela-master'

      # 6. Validate Compose, build the application, and deploy.
      - name: Validate and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_IP_STAGING }}
          SSH_USER: ${{ secrets.SSH_USER_STAGING }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/staging_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'set -eu
             cd /home/ubuntu/devops/travela-master

             echo "Validating Docker Compose..."
             docker compose config --quiet

             echo "Building Laravel application..."
             docker compose build app

             echo "Deploying containers..."
             docker compose up -d --remove-orphans

             echo "Container status:"
             docker compose ps'

      # 7. Always remove the temporary private key from the runner.
      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/staging_key"
